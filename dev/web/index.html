<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMXEasy Web DMX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Faders tactiles larges et ergonomiques */
        .fader-container {
            position: relative;
            width: 70px;
            height: 240px;
        }

        input[type=range].fader-touch {
            -webkit-appearance: none;
            appearance: none;
            width: 240px;
            height: 44px; /* Largeur confortable pour le doigt */
            background: #1e293b;
            border-radius: 8px;
            outline: none;
            transform: rotate(-90deg);
            transform-origin: 120px 120px;
            position: absolute;
            top: 0;
            left: -85px;
            margin: 0;
            cursor: pointer;
            border: 2px solid #334155;
        }

        input[type=range].fader-touch::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 48px; /* Hauteur du bouton tactile */
            height: 40px;
            background: #3b82f6;
            border-radius: 6px;
            border: 2px solid #93c5fd;
            cursor: grab;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }

        input[type=range].fader-touch::-webkit-slider-thumb:active {
            background: #60a5fa;
            cursor: grabbing;
        }

        /* Scrollbars discrètes */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- TOP BAR GLOBAL -->
    <header class="bg-slate-950 border-b border-slate-800 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white text-xl shadow-lg">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight">SUNLIGHT <span class="text-blue-500">LIVE DASHBOARD</span></h1>
                <p class="text-[10px] text-slate-400">Console de contrôle tactile simplifiée</p>
            </div>
        </div>

        <!-- Statut d'activité DMX global -->
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-4 bg-slate-900 px-4 py-2 rounded-xl border border-slate-800">
                <div class="flex items-center gap-2">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                    <span class="text-xs font-mono text-slate-300">DMX OK</span>
                </div>
                <div class="h-4 w-px bg-slate-800"></div>
                <span class="text-xs font-mono text-slate-400">Actifs : <span id="active-fixtures-count" class="text-blue-400 font-bold">0</span></span>
            </div>

            <!-- Boutons d'action rapide -->
            <div class="flex gap-2">
                <button onclick="blackout()" class="bg-red-600 hover:bg-red-500 active:scale-95 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg shadow-red-900/40 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-power-off text-base"></i> BLACKOUT
                </button>
                <button onclick="fullOn()" class="bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 px-5 py-2.5 rounded-xl font-bold shadow-lg shadow-amber-500/20 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-sun text-base"></i> FULL ON
                </button>
            </div>
        </div>
    </header>

    <!-- WORKSPACE UNIQUE -->
    <div class="flex-1 flex overflow-hidden">

        <!-- PANNEAU DE CONTRÔLE GAUCHE : PATCH & ÉTAT DES MACHINES -->
        <div class="w-1/3 bg-slate-950 p-4 border-r border-slate-900 flex flex-col gap-4 overflow-y-auto">
            
            <!-- Section État Live des Machines -->
            <div class="bg-slate-900/50 rounded-2xl p-4 border border-slate-800/80 flex flex-col flex-1 min-h-[300px]">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-eye text-blue-400"></i> ÉTAT LIVE DES MACHINES
                    </h3>
                    <span class="text-xs text-slate-500">Clique pour allumer/éteindre (Flash)</span>
                </div>
                
                <!-- Grille d'état rapide (Visualiseur d'activité réel) -->
                <div id="live-monitor-grid" class="grid grid-cols-2 gap-3 overflow-y-auto flex-1 pr-1">
                    <!-- Généré dynamiquement en JS (Cartes interactives avec couleurs DMX) -->
                </div>
            </div>

            <!-- Section Patch Rapide -->
            <div class="bg-slate-900/30 rounded-2xl p-4 border border-slate-900/50">
                <button onclick="togglePatchForm()" class="w-full flex justify-between items-center text-slate-400 hover:text-white transition-colors">
                    <span class="font-bold text-xs uppercase tracking-wider"><i class="fa-solid fa-plug mr-2 text-indigo-400"></i>Ajouter une machine</span>
                    <i id="patch-arrow" class="fa-solid fa-chevron-down transition-transform"></i>
                </button>
                
                <div id="patch-form" class="hidden mt-4 space-y-3 pt-3 border-t border-slate-800">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-slate-500 text-[10px] mb-1">Nom</label>
                            <input type="text" id="patch-name" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-blue-500" placeholder="Par LED">
                        </div>
                        <div>
                            <label class="block text-slate-500 text-[10px] mb-1">Type de machine</label>
                            <select id="patch-type" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-blue-500">
                                <option value="dimmer">Dimmer (1 Canal)</option>
                                <option value="rgb">RGB (3 Canaux)</option>
                                <option value="rgbw">RGBW (4 Canaux)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-500 text-[10px] mb-1">Adresse de départ (1-512)</label>
                        <input type="number" id="patch-address" min="1" max="512" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-blue-500" value="1">
                    </div>
                    <button onclick="addFixture()" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-lg text-xs font-bold transition-all active:scale-[0.98]">
                        <i class="fa-solid fa-plus mr-1"></i> Configurer & Patcher
                    </button>
                </div>
            </div>
        </div>

        <!-- BLOC DE CONTRÔLE CENTRAL ET DROIT (FADERS ET PADS DE SCÈNES) -->
        <div class="flex-1 flex flex-col overflow-hidden bg-slate-900">
            
            <!-- SECTION DU HAUT : LAUNCHPAD DE SCÈNES (TACTILE) -->
            <div class="p-6 border-b border-slate-800/60 bg-slate-900/50">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-border-all text-emerald-400"></i> PADS DE SCÈNES (TAP LIVE)
                    </h3>
                    <div class="flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-850">
                        <input type="text" id="scene-name" class="bg-transparent text-xs text-slate-300 focus:outline-none w-44" placeholder="Nommer l'état actuel...">
                        <button onclick="saveScene()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1 rounded font-bold transition-all active:scale-95">
                            <i class="fa-solid fa-floppy-disk mr-1"></i> Enregistrer
                        </button>
                    </div>
                </div>

                <!-- Grille de scènes tactiles -->
                <div id="scenes-grid" class="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-8 gap-3 max-h-[160px] overflow-y-auto">
                    <!-- Généré en JS (Gros boutons tactiles avec état ON/OFF) -->
                </div>
            </div>

            <!-- SECTION DU BAS : FADERS TACTILES LARGEUR EXTRA -->
            <div class="flex-1 p-6 flex flex-col min-h-0">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-blue-400"></i> CONSOLE FADERS TACTILE
                    </h3>
                    
                    <!-- Grand fader Master -->
                    <div class="flex items-center gap-3 bg-slate-950 py-1.5 px-4 rounded-xl border border-slate-800">
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Grand Master</span>
                        <input type="range" id="master-fader" min="0" max="255" value="255" class="w-32 accent-blue-500 cursor-pointer" oninput="updateMaster()">
                        <span id="master-val" class="font-mono text-xs text-blue-400 font-bold w-8 text-right">255</span>
                    </div>
                </div>

                <!-- Conteneur des Faders horizontaux scrollables -->
                <div class="flex-1 overflow-x-auto overflow-y-hidden pb-4">
                    <div id="faders-container" class="flex gap-4 h-full items-start min-w-max">
                        <!-- Généré en JS -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-950 border border-slate-800 text-white px-5 py-4 rounded-2xl shadow-2xl transform transition-all translate-y-20 opacity-0 flex items-center gap-3 z-50">
        <i class="fa-solid fa-circle-info text-blue-400 text-lg"></i>
        <span id="toast-msg" class="text-xs font-semibold">Message</span>
    </div>

    <script>
        // --- ÉTAT GLOBAL DE L'APPLICATION ---
        let universe = new Array(512).fill(0);
        let masterValue = 255;
        let fixtures = [];
        let fixtureCounter = 1;
        let scenes = [];
        let activeSceneId = null;

        // Configurations des types de projecteurs
        const fixtureTypes = {
            'dimmer': { name: 'Dimmer', channels: 1, labels: ['Intensité'] },
            'rgb': { name: 'RGB', channels: 3, labels: ['Rouge', 'Vert', 'Bleu'] },
            'rgbw': { name: 'RGBW', channels: 4, labels: ['Rouge', 'Vert', 'Bleu', 'Blanc'] }
        };

        // --- CYCLE DE VIE ---
        window.onload = () => {
            loadDemoFixtures();
            updateMaster();
        };

        // Charge un ensemble de démo robuste pour un rendu instantané
        function loadDemoFixtures() {
            const demoFixtures = [
                { name: "Face Centre", type: 'dimmer', address: 1 },
                { name: "Face Gauche", type: 'dimmer', address: 2 },
                { name: "Face Droite", type: 'dimmer', address: 3 },
                { name: "Wash LED L1", type: 'rgb', address: 10 },
                { name: "Wash LED L2", type: 'rgb', address: 13 },
                { name: "Wash LED R1", type: 'rgb', address: 16 },
                { name: "Wash LED R2", type: 'rgb', address: 19 },
                { name: "Projecteur Fond", type: 'rgbw', address: 30 }
            ];

            demoFixtures.forEach(df => {
                fixtures.push({
                    id: fixtureCounter++,
                    name: df.name,
                    address: df.address,
                    type: df.type,
                    channels: fixtureTypes[df.type].channels
                });
            });

            // Initialiser un état DMX par défaut
            universe[0] = 200; // Face centre
            universe[1] = 120; // Face gauche
            universe[9] = 255; // Wash L1 Rouge
            universe[14] = 255; // Wash R1 Bleu
            universe[32] = 255; // Fond Bleu
            universe[33] = 100; // Fond Blanc

            // Créer deux scènes par défaut
            scenes.push({
                id: 101,
                name: "Ambiance Chaude",
                state: [...universe]
            });

            // Une autre scène contrastée
            let alternativeState = new Array(512).fill(0);
            alternativeState[0] = 255; alternativeState[1] = 255; alternativeState[2] = 255;
            alternativeState[10] = 255; alternativeState[13] = 255; // Vert
            alternativeState[31] = 255; // Fond Vert
            scenes.push({
                id: 102,
                name: "Scène Club Vert",
                state: alternativeState
            });

            updatePatchTable();
            renderFaders();
            renderScenes();
            updateLiveMonitor();
        }

        // UI Toast
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            msgEl.innerText = msg;
            toast.querySelector('i').className = isError ? "fa-solid fa-triangle-exclamation text-red-500 text-lg" : "fa-solid fa-circle-check text-green-400 text-lg";
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 2500);
        }

        // --- ACCORDÉON DU PATCH ---
        function togglePatchForm() {
            const form = document.getElementById('patch-form');
            const arrow = document.getElementById('patch-arrow');
            form.classList.toggle('hidden');
            arrow.classList.toggle('rotate-180');
        }

        // --- LOGIQUE DE PATCH ---
        function addFixture() {
            const name = document.getElementById('patch-name').value || `Projecteur ${fixtureCounter}`;
            const address = parseInt(document.getElementById('patch-address').value);
            const typeKey = document.getElementById('patch-type').value;

            const typeInfo = fixtureTypes[typeKey];

            if (address < 1 || address + typeInfo.channels - 1 > 512) {
                showToast("Erreur d'adresse DMX (1-512)", true);
                return;
            }

            // Vérifier les superpositions
            const conflict = fixtures.find(f => {
                const start1 = f.address;
                const end1 = f.address + f.channels - 1;
                const start2 = address;
                const end2 = address + typeInfo.channels - 1;
                return (start2 <= end1 && end2 >= start1);
            });

            if (conflict) {
                showToast(`Conflit d'adresse avec "${conflict.name}"`, true);
                return;
            }

            fixtures.push({
                id: fixtureCounter++,
                name: name,
                address: address,
                type: typeKey,
                channels: typeInfo.channels
            });

            fixtures.sort((a, b) => a.address - b.address);

            // Proposer l'adresse suivante
            document.getElementById('patch-address').value = address + typeInfo.channels;
            document.getElementById('patch-name').value = '';

            updatePatchTable();
            renderFaders();
            updateLiveMonitor();
            showToast(`"${name}" patché avec succès (DMX ${address})`);
        }

        function deleteFixture(id) {
            fixtures = fixtures.filter(f => f.id !== id);
            updatePatchTable();
            renderFaders();
            updateLiveMonitor();
            showToast("Projecteur désinstallé");
        }

        function updatePatchTable() {
            // Mettre à jour l'adresse par défaut disponible
            if(fixtures.length > 0) {
                const last = fixtures[fixtures.length - 1];
                document.getElementById('patch-address').value = last.address + last.channels;
            }
        }

        // --- CONSOLE DE FADERS ---
        function renderFaders() {
            const container = document.getElementById('faders-container');
            container.innerHTML = '';

            if (fixtures.length === 0) {
                container.innerHTML = `
                    <div class="text-slate-500 p-8 text-center flex-1 flex flex-col items-center justify-center">
                        <i class="fa-solid fa-sliders text-5xl mb-3 opacity-30 animate-pulse"></i>
                        <p class="text-xs">Aucun fader à afficher. Patchez d'abord un projecteur.</p>
                    </div>`;
                return;
            }

            fixtures.forEach(fixture => {
                const typeInfo = fixtureTypes[fixture.type];
                
                const card = document.createElement('div');
                card.className = "bg-slate-950 border border-slate-800 rounded-2xl p-4 flex flex-col items-center shadow-lg h-[340px] w-fit min-w-[90px]";
                
                // Titre
                const nameEl = document.createElement('div');
                nameEl.className = "text-[11px] font-bold text-slate-300 mb-4 max-w-[80px] truncate text-center uppercase tracking-wide";
                nameEl.innerText = fixture.name;
                card.appendChild(nameEl);

                // Zone des faders de la machine
                const slidersBox = document.createElement('div');
                slidersBox.className = "flex gap-3 justify-center items-center flex-1";

                for (let i = 0; i < fixture.channels; i++) {
                    const absChannel = fixture.address + i;
                    const val = universe[absChannel - 1];
                    const label = typeInfo.labels[i];

                    // Code couleur intuitif
                    let colorClass = "text-slate-500";
                    if(label.includes("Rouge")) colorClass = "text-red-500 font-bold";
                    if(label.includes("Vert")) colorClass = "text-green-500 font-bold";
                    if(label.includes("Bleu")) colorClass = "text-blue-500 font-bold";
                    if(label.includes("Blanc")) colorClass = "text-slate-100 font-bold";
                    if(label.includes("Intensité")) colorClass = "text-amber-500 font-bold";

                    const col = document.createElement('div');
                    col.className = "flex flex-col items-center justify-between h-full w-[70px]";

                    col.innerHTML = `
                        <span class="text-[9px] font-mono text-slate-600 bg-slate-900 px-1 rounded">Ch ${absChannel}</span>
                        <div class="fader-container">
                            <input type="range" class="fader-touch" min="0" max="255" value="${val}" 
                                   data-channel="${absChannel-1}" oninput="handleFaderTouch(this)">
                        </div>
                        <div class="flex flex-col items-center mt-2">
                            <span class="text-xs font-mono font-bold text-blue-400 bg-slate-900/60 px-1.5 py-0.5 rounded border border-slate-800/40">${val}</span>
                            <span class="text-[9px] uppercase tracking-wider ${colorClass} mt-1">${label.slice(0, 5)}.</span>
                        </div>
                    `;
                    slidersBox.appendChild(col);
                }

                card.appendChild(slidersBox);
                container.appendChild(card);
            });
        }

        function handleFaderTouch(input) {
            const channelIdx = parseInt(input.getAttribute('data-channel'));
            const value = parseInt(input.value);
            universe[channelIdx] = value;
            
            // Mise à jour de l'affichage de la valeur chiffrée
            const container = input.closest('.fader-container');
            const valDisplay = container.nextElementSibling.querySelector('span');
            valDisplay.innerText = value;

            // Reset l'indicateur de scène active car on a altéré l'univers manuellement
            setActiveSceneIndicator(null);

            // Mettre à jour l'état visuel live
            updateLiveMonitor();
        }

        // --- GESTION DU MASTER GLOBAL ---
        function updateMaster() {
            masterValue = parseInt(document.getElementById('master-fader').value);
            document.getElementById('master-val').innerText = masterValue;
            updateLiveMonitor();
        }

        // --- SYSTEME MONITOR LIVE (VOIR CE QUI EST ACTIF/ETEINT) ---
        function updateLiveMonitor() {
            const grid = document.getElementById('live-monitor-grid');
            grid.innerHTML = '';
            
            let activeCount = 0;

            fixtures.forEach(fixture => {
                const start = fixture.address - 1;
                let active = false;
                let bgColor = 'rgba(30, 41, 59, 0.5)'; // Slate transparent par défaut (éteint)
                let statusText = 'OFF';
                let intensity = 0;
                
                // Extraction de l'état couleur/intensité de la machine
                if (fixture.type === 'dimmer') {
                    intensity = Math.floor((universe[start] * masterValue) / 255);
                    active = intensity > 5;
                    bgColor = `rgba(${intensity}, ${intensity}, ${intensity}, ${active ? '0.4' : '0.1'})`;
                    statusText = active ? `${Math.round((intensity/255)*100)}%` : 'OFF';
                } else if (fixture.type === 'rgb') {
                    const r = Math.floor((universe[start] * masterValue) / 255);
                    const g = Math.floor((universe[start+1] * masterValue) / 255);
                    const b = Math.floor((universe[start+2] * masterValue) / 255);
                    intensity = Math.max(r, g, b);
                    active = intensity > 5;
                    bgColor = `rgba(${r}, ${g}, ${b}, ${active ? '0.55' : '0.15'})`;
                    statusText = active ? 'ACTIF' : 'OFF';
                } else if (fixture.type === 'rgbw') {
                    const r = Math.floor((universe[start] * masterValue) / 255);
                    const g = Math.floor((universe[start+1] * masterValue) / 255);
                    const b = Math.floor((universe[start+2] * masterValue) / 255);
                    const w = Math.floor((universe[start+3] * masterValue) / 255);
                    // Combinaison couleur + blanc
                    const finalR = Math.min(255, r + w);
                    const finalG = Math.min(255, g + w);
                    const finalB = Math.min(255, b + w);
                    intensity = Math.max(finalR, finalG, finalB);
                    active = intensity > 5;
                    bgColor = `rgba(${finalR}, ${finalG}, ${finalB}, ${active ? '0.55' : '0.15'})`;
                    statusText = active ? 'ACTIF' : 'OFF';
                }

                if (active) activeCount++;

                // Création du bouton/carte live tactile de la machine
                const item = document.createElement('button');
                item.onclick = () => toggleFixtureFlash(fixture.id);
                
                // Style dynamique de la bordure et de l'ombre de flux lumineux
                const activeBorder = active ? 'border-blue-500 shadow-lg shadow-blue-500/10' : 'border-slate-800';
                
                item.className = `flex flex-col justify-between p-3 rounded-xl border ${activeBorder} text-left transition-all active:scale-95`;
                item.style.backgroundColor = bgColor;

                item.innerHTML = `
                    <div class="flex justify-between items-start w-full">
                        <span class="font-bold text-xs text-white max-w-[100px] truncate">${fixture.name}</span>
                        <span class="text-[9px] font-mono text-slate-400">@${fixture.address}</span>
                    </div>
                    <div class="flex justify-between items-end w-full mt-4">
                        <span class="text-[10px] uppercase font-bold text-slate-400">${fixture.type}</span>
                        <div class="flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full ${active ? 'bg-green-500 animate-pulse' : 'bg-slate-700'}"></span>
                            <span class="text-[10px] font-bold font-mono ${active ? 'text-green-400' : 'text-slate-500'}">${statusText}</span>
                        </div>
                    </div>
                `;
                
                grid.appendChild(item);
            });

            // Mettre à jour le compteur global d'actifs
            document.getElementById('active-fixtures-count').innerText = activeCount;
        }

        // Permet d'allumer/éteindre instantanément une machine en touchant sa carte d'état
        function toggleFixtureFlash(id) {
            const fixture = fixtures.find(f => f.id === id);
            if (!fixture) return;

            const start = fixture.address - 1;
            const currentlyActive = universe[start] > 0 || (fixture.channels > 1 && (universe[start+1] > 0 || universe[start+2] > 0));

            // Si elle est allumée, on l'éteint. Sinon, on la met à fond (Full)
            for (let i = 0; i < fixture.channels; i++) {
                universe[start + i] = currentlyActive ? 0 : 255;
            }

            // Rafraîchir l'interface
            renderFaders();
            updateLiveMonitor();
            setActiveSceneIndicator(null);
        }

        // --- MACROS RAPIDES : BLACKOUT & FULL ON ---
        function blackout() {
            universe.fill(0);
            renderFaders();
            updateLiveMonitor();
            setActiveSceneIndicator(null);
            showToast("Blackout général appliqué !", true);
        }

        function fullOn() {
            // Allumer tous les canaux affectés par le patch à 255
            fixtures.forEach(f => {
                const start = f.address - 1;
                for (let i = 0; i < f.channels; i++) {
                    universe[start + i] = 255;
                }
            });
            renderFaders();
            updateLiveMonitor();
            setActiveSceneIndicator(null);
            showToast("Full ON général !");
        }


        // --- ENGINE DES SCÈNES / TACTILE PADS ---
        function saveScene() {
            const nameInput = document.getElementById('scene-name');
            const name = nameInput.value.trim() || `Scène ${scenes.length + 1}`;

            const newScene = {
                id: Date.now(),
                name: name,
                state: [...universe]
            };

            scenes.push(newScene);
            nameInput.value = '';
            renderScenes();
            setActiveSceneIndicator(newScene.id);
            showToast(`Scène "${name}" créée avec succès.`);
        }

        function renderScenes() {
            const grid = document.getElementById('scenes-grid');
            grid.innerHTML = '';

            if (scenes.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-slate-600 text-xs italic">Aucune scène enregistrée.</p>`;
                return;
            }

            scenes.forEach(scene => {
                const isActive = scene.id === activeSceneId;
                const button = document.createElement('button');
                
                // Style tactile large (type pad launchpad)
                const activeStyle = isActive 
                    ? 'bg-emerald-600 border-emerald-400 text-white shadow-lg shadow-emerald-500/20' 
                    : 'bg-slate-950 border-slate-800 hover:border-slate-700 text-slate-300';

                button.className = `h-16 px-3 rounded-xl border flex flex-col justify-between items-start text-left transition-all active:scale-95 ${activeStyle}`;
                button.onclick = () => playScene(scene.id);
                button.oncontextmenu = (e) => {
                    e.preventDefault();
                    deleteScene(scene.id);
                };

                button.innerHTML = `
                    <span class="text-[10px] font-bold truncate w-full tracking-wide">${scene.name}</span>
                    <div class="flex justify-between items-center w-full mt-1">
                        <span class="text-[8px] opacity-40 uppercase">Scene</span>
                        <div class="w-1.5 h-1.5 rounded-full ${isActive ? 'bg-white animate-pulse' : 'bg-slate-700'}"></div>
                    </div>
                `;
                grid.appendChild(button);
            });
        }

        function playScene(id) {
            const scene = scenes.find(s => s.id === id);
            if (scene) {
                universe = [...scene.state];
                renderFaders();
                setActiveSceneIndicator(scene.id);
                updateLiveMonitor();
                showToast(`Rappel Scène : ${scene.name}`);
            }
        }

        function deleteScene(id) {
            scenes = scenes.filter(s => s.id !== id);
            if (activeSceneId === id) activeSceneId = null;
            renderScenes();
            showToast("Scène supprimée");
        }

        function setActiveSceneIndicator(id) {
            activeSceneId = id;
            renderScenes();
        }
    </script>
</body>
</html>
